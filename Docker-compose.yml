services:
  frontend:
    build: .
    container_name: frontend
    env_file: .env
    ports:
      - "5173:5173"
    networks:
      - cm_net
    # Si quieres hot-reload perfecto, monta tu código:
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

networks:
  cm_net:
    external: true